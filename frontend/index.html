<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker Kanban</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --border: #d9e2ef;
      --text: #102a43;
      --muted: #637381;
      --accent: #2563eb;
      --success: #047857;
      --warning: #b45309;
      --danger: #b91c1c;
      font-family: Inter, system-ui, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    .page-shell {
      max-width: 1160px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.8rem);
      letter-spacing: -0.03em;
    }

    header p {
      margin: 14px auto 0;
      max-width: 700px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1rem;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .board-status {
      margin-bottom: 18px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--muted);
    }

    .board-status[hidden] {
      display: none;
    }

    .board-status button {
      margin-left: 10px;
    }

    .kanban-column {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 520px;
    }

    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .column-header h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .column-header .count {
      background: #eff6ff;
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .column-subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .column-content {
      display: grid;
      gap: 16px;
      flex: 1;
    }

    .task-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: grid;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }

    .task-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .task-card-header h3 {
      margin: 0;
      font-size: 1rem;
    }

    .task-description {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      min-height: 48px;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .task-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      background: #f3f4f6;
      color: var(--text);
    }

    .task-badge.priority-high {
      background: #fee2e2;
      color: var(--danger);
    }

    .task-badge.priority-medium {
      background: #fef3c7;
      color: var(--warning);
    }

    .task-badge.priority-low {
      background: #dcfce7;
      color: var(--success);
    }

    .edit-button {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--accent);
      padding: 8px 14px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .edit-button:hover {
      background: #eff6ff;
    }

    .primary-button {
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      padding: 9px 16px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    header .primary-button {
      margin-top: 18px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.48);
    }

    .modal-overlay[hidden] {
      display: none;
    }

    .task-modal {
      width: min(100%, 560px);
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      padding: 22px;
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.22);
    }

    .modal-header,
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .task-form {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .form-field {
      display: grid;
      gap: 6px;
      font-weight: 700;
    }

    .form-field input,
    .form-field textarea,
    .form-field select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: #ffffff;
      color: var(--text);
      font: inherit;
      font-weight: 400;
    }

    .form-error {
      margin: 0;
      color: var(--danger);
      font-size: 0.9rem;
      font-weight: 400;
    }

    .form-error[hidden] {
      display: none;
    }

    .modal-actions {
      justify-content: flex-end;
      margin-top: 4px;
    }

    @media (max-width: 960px) {
      .board {
        grid-template-columns: 1fr;
      }
    }
    .kanban-column.drop-target {
      background: #f0f7ff;
      border-color: #7aa7ff;
      box-shadow: 0 10px 30px rgba(45, 120, 255, 0.06);
    }

    .task-card.dragging {
      opacity: 0.5;
      transform: scale(0.995);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08) !important;
    }

    /* Modern visual refresh */
    :root {
      --bg: #f4f5fb;
      --card: rgba(255, 255, 255, 0.9);
      --border: rgba(148, 163, 184, 0.22);
      --text: #182036;
      --muted: #687086;
      --accent: #6d5dfc;
      --accent-dark: #5145cd;
      --success: #07875f;
      --warning: #b86609;
      --danger: #c43d56;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 8% 0%, rgba(109, 93, 252, 0.14), transparent 28rem),
        radial-gradient(circle at 92% 8%, rgba(33, 196, 170, 0.1), transparent 25rem),
        linear-gradient(180deg, #fafaff 0%, var(--bg) 42%, #eef1f8 100%);
      background-attachment: fixed;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      opacity: 0.28;
      background-image: radial-gradient(rgba(100, 116, 139, 0.25) 0.7px, transparent 0.7px);
      background-size: 22px 22px;
      pointer-events: none;
    }

    .page-shell {
      max-width: 1280px;
      padding: 42px 32px 56px;
    }

    header {
      position: relative;
      margin-bottom: 30px;
      padding: 42px clamp(24px, 5vw, 64px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 28px;
      background:
        linear-gradient(120deg, rgba(25, 31, 57, 0.98), rgba(54, 45, 125, 0.95)),
        var(--text);
      color: #fff;
      text-align: left;
      box-shadow: 0 24px 70px rgba(45, 38, 104, 0.2);
    }

    header::after {
      position: absolute;
      top: -90px;
      right: -70px;
      width: 300px;
      height: 300px;
      border: 60px solid rgba(255, 255, 255, 0.07);
      border-radius: 50%;
      content: "";
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      color: #bcb5ff;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5eead4;
      box-shadow: 0 0 0 5px rgba(94, 234, 212, 0.12);
      content: "";
    }

    header h1 {
      position: relative;
      z-index: 1;
      max-width: 700px;
      font-size: clamp(2.3rem, 5vw, 4rem);
      font-weight: 780;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }

    header p {
      position: relative;
      z-index: 1;
      margin: 18px 0 0;
      max-width: 580px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.04rem;
    }

    header .primary-button {
      position: absolute;
      right: clamp(24px, 5vw, 64px);
      bottom: 48px;
      z-index: 1;
      margin: 0;
      border-color: transparent;
      background: #fff;
      color: #302769;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
    }

    header .primary-button::before {
      margin-right: 8px;
      content: "+";
      font-size: 1.2rem;
      line-height: 0;
    }

    .board-status {
      margin-bottom: 20px;
      border-color: var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 10px 30px rgba(30, 41, 59, 0.06);
      backdrop-filter: blur(14px);
    }

    .board {
      gap: 20px;
    }

    .kanban-column {
      min-height: 560px;
      padding: 20px;
      border-color: var(--border);
      border-radius: 22px;
      background: rgba(248, 250, 255, 0.68);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 18px 50px rgba(30, 41, 59, 0.07);
      backdrop-filter: blur(16px);
      transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .kanban-column[data-status="ToDo"] {
      border-top: 3px solid #8b7dfd;
    }

    .kanban-column[data-status="InProgress"] {
      border-top: 3px solid #f5a947;
    }

    .kanban-column[data-status="Done"] {
      border-top: 3px solid #35b893;
    }

    .column-header {
      align-items: center;
      margin-bottom: 8px;
    }

    .column-header h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 760;
      letter-spacing: -0.015em;
    }

    .column-header h2::before {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      font-size: 0.82rem;
      content: "";
    }

    [data-status="ToDo"] .column-header h2::before {
      background: #eeebff;
      color: #6455df;
      content: "○";
    }

    [data-status="InProgress"] .column-header h2::before {
      background: #fff1dc;
      color: #b86609;
      content: "◐";
    }

    [data-status="Done"] .column-header h2::before {
      background: #dcf7ee;
      color: #07875f;
      content: "✓";
    }

    .column-header .count {
      min-width: 32px;
      padding: 6px 10px;
      background: rgba(109, 93, 252, 0.09);
      color: #6254d8;
      text-align: center;
    }

    .column-subtitle {
      margin: 0 0 20px 40px;
      font-size: 0.82rem;
    }

    .column-content {
      align-content: start;
      gap: 13px;
    }

    .task-card {
      position: relative;
      gap: 12px;
      padding: 17px;
      overflow: hidden;
      border-color: rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 8px 24px rgba(41, 50, 81, 0.075);
      cursor: grab;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .task-card::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: #8b7dfd;
      content: "";
    }

    .task-card[data-priority="High"]::before { background: #ef637c; }
    .task-card[data-priority="Medium"]::before { background: #f4ad4d; }
    .task-card[data-priority="Low"]::before { background: #35b893; }

    .task-card:hover {
      z-index: 1;
      border-color: rgba(109, 93, 252, 0.28);
      box-shadow: 0 16px 34px rgba(41, 50, 81, 0.13);
      transform: translateY(-3px);
    }

    .task-card:active {
      cursor: grabbing;
    }

    .task-card-header h3 {
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .task-description {
      min-height: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .task-meta {
      gap: 7px;
      padding-top: 2px;
    }

    .task-badge {
      padding: 5px 9px;
      background: #f2f4f8;
      color: #626a7f;
      font-size: 0.72rem;
      font-weight: 720;
    }

    .task-badge.priority-high { background: #fff0f2; color: #c43d56; }
    .task-badge.priority-medium { background: #fff5e7; color: #a85b08; }
    .task-badge.priority-low { background: #e8f8f2; color: #08795a; }

    .edit-button,
    .primary-button {
      min-height: 40px;
      border-radius: 11px;
      font-weight: 700;
      transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .edit-button {
      padding: 7px 12px;
      border-color: rgba(109, 93, 252, 0.2);
      background: rgba(109, 93, 252, 0.06);
      color: var(--accent-dark);
      font-size: 0.78rem;
    }

    .edit-button:hover {
      background: rgba(109, 93, 252, 0.12);
    }

    .primary-button {
      padding: 10px 18px;
      border-color: var(--accent);
      background: linear-gradient(135deg, #7868ff, #5a4bd8);
      box-shadow: 0 8px 20px rgba(109, 93, 252, 0.24);
    }

    .primary-button:hover,
    .edit-button:hover {
      transform: translateY(-1px);
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(109, 93, 252, 0.22);
      outline-offset: 2px;
    }

    .modal-overlay {
      background: rgba(22, 26, 47, 0.58);
      backdrop-filter: blur(7px);
    }

    .task-modal {
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      box-shadow: 0 32px 90px rgba(18, 22, 42, 0.3);
      animation: modal-in 180ms ease-out;
    }

    .modal-header h2 {
      font-size: 1.45rem;
      letter-spacing: -0.035em;
    }

    .task-form {
      gap: 17px;
      margin-top: 24px;
    }

    .form-field {
      gap: 8px;
      color: #41485d;
      font-size: 0.83rem;
      letter-spacing: 0.01em;
    }

    .form-field input,
    .form-field textarea,
    .form-field select {
      border-color: rgba(148, 163, 184, 0.38);
      border-radius: 12px;
      padding: 12px 13px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(109, 93, 252, 0.1);
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 760px) {
      .page-shell { padding: 18px 14px 36px; }
      header { padding: 30px 24px; }
      header h1 { font-size: 2.45rem; }
      header p { max-width: calc(100% - 20px); }
      header .primary-button {
        position: relative;
        right: auto;
        bottom: auto;
        margin-top: 24px;
      }
      .board { gap: 14px; }
      .kanban-column { min-height: 360px; }
      .task-modal { padding: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header>
      <p class="eyebrow">Workspace overview</p>
      <h1>Task Tracker</h1>
      <p>Turn plans into progress. Organize priorities, move work forward, and keep the whole picture in view.</p>
      <button id="new-task-button" class="primary-button" type="button">New Task</button>
    </header>

    <div id="board-status" class="board-status" role="status" aria-live="polite"></div>

    <main class="board" data-state="loading" aria-busy="true">
      <section class="kanban-column" data-status="ToDo">
        <div class="column-header">
          <h2>To Do</h2>
          <span class="count">0</span>
        </div>
        <p class="column-subtitle">Tasks waiting to be started.</p>
        <div class="column-content"></div>
      </section>
      <section class="kanban-column" data-status="InProgress">
        <div class="column-header">
          <h2>In Progress</h2>
          <span class="count">0</span>
        </div>
        <p class="column-subtitle">Tasks currently being worked on.</p>
        <div class="column-content"></div>
      </section>
      <section class="kanban-column" data-status="Done">
        <div class="column-header">
          <h2>Done</h2>
          <span class="count">0</span>
        </div>
        <p class="column-subtitle">Completed tasks ready for review.</p>
        <div class="column-content"></div>
      </section>
    </main>
  </div>

  <div id="task-modal" class="modal-overlay" hidden>
    <section class="task-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">New Task</h2>
        <button id="modal-close" class="edit-button" type="button" aria-label="Close task form">Close</button>
      </div>

      <form id="task-form" class="task-form" novalidate>
        <input id="task-id" name="taskId" type="hidden" />

        <label class="form-field" for="task-title">
          Title
          <input id="task-title" name="title" type="text" maxlength="200" />
          <span id="title-error" class="form-error" hidden></span>
        </label>

        <label class="form-field" for="task-description">
          Description
          <textarea id="task-description" name="description" rows="3"></textarea>
        </label>

        <label class="form-field" for="task-status">
          Status
          <select id="task-status" name="status">
            <option value="ToDo">To Do</option>
            <option value="InProgress">In Progress</option>
            <option value="Done">Done</option>
          </select>
        </label>

        <label class="form-field" for="task-priority">
          Priority
          <select id="task-priority" name="priority">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </label>

        <label class="form-field" for="task-assignee">
          Assignee
          <input id="task-assignee" name="assignee" type="text" />
        </label>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="modal-actions">
          <button id="modal-cancel" class="edit-button" type="button">Cancel</button>
          <button id="modal-submit" class="primary-button" type="submit">Create Task</button>
        </div>
      </form>
    </section>
  </div>

  <script>
      const apiBase = window.location.protocol === 'file:'
        ? 'http://localhost:8000'
        : window.location.origin;
      let tasks = [];

      const priorityOrder = { High: 1, Medium: 2, Low: 3 };
      const taskModal = document.querySelector('#task-modal');
      const taskForm = document.querySelector('#task-form');
      const modalTitle = document.querySelector('#modal-title');
      const taskIdInput = document.querySelector('#task-id');
      const titleInput = document.querySelector('#task-title');
      const descriptionInput = document.querySelector('#task-description');
      const statusInput = document.querySelector('#task-status');
      const priorityInput = document.querySelector('#task-priority');
      const assigneeInput = document.querySelector('#task-assignee');
      const titleError = document.querySelector('#title-error');
      const formError = document.querySelector('#form-error');
      const modalSubmit = document.querySelector('#modal-submit');
      let modalTrigger = null;

      function attachDragHandlers(card) {
        card.draggable = true;

        card.addEventListener('dragstart', (event) => {
          const id = card.dataset.taskId;
          if (!id) return;
          event.dataTransfer.setData('text/plain', id);
          event.dataTransfer.effectAllowed = 'move';
          card.classList.add('dragging');
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.kanban-column').forEach((c) => c.classList.remove('drop-target'));
        });
      }

      function getUpdateErrorMessage(payload, status) {
        if (typeof payload?.detail === 'string') return payload.detail;
        if (Array.isArray(payload?.detail)) {
          return payload.detail.map((error) => error.msg).filter(Boolean).join('; ')
            || `Unable to update task (${status})`;
        }
        return `Unable to update task (${status})`;
      }

      function clearModalErrors() {
        titleError.textContent = '';
        titleError.hidden = true;
        formError.textContent = '';
        formError.hidden = true;
      }

      function showModalError(message, field = 'form') {
        const target = field === 'title' ? titleError : formError;
        target.textContent = message;
        target.hidden = false;
      }

      function showServerErrors(payload, status) {
        const detail = payload?.detail;

        if (Array.isArray(detail)) {
          const titleMessages = detail
            .filter((error) => error.loc?.includes('title'))
            .map((error) => error.msg)
            .filter(Boolean);
          const otherMessages = detail
            .filter((error) => !error.loc?.includes('title'))
            .map((error) => error.msg)
            .filter(Boolean);

          if (titleMessages.length) showModalError(titleMessages.join('; '), 'title');
          if (otherMessages.length) showModalError(otherMessages.join('; '));
          if (titleMessages.length || otherMessages.length) return;
        }

        showModalError(getUpdateErrorMessage(payload, status));
      }

      function closeTaskModal() {
        taskModal.hidden = true;
        taskForm.reset();
        taskIdInput.value = '';
        clearModalErrors();

        if (modalTrigger?.isConnected) modalTrigger.focus();
        modalTrigger = null;
      }

      function openTaskModal(task = null, trigger = null) {
        taskForm.reset();
        clearModalErrors();
        modalTrigger = trigger;

        taskIdInput.value = task?.id ?? '';
        titleInput.value = task?.title ?? '';
        descriptionInput.value = task?.description ?? '';
        statusInput.value = task?.status ?? 'ToDo';
        priorityInput.value = task?.priority ?? 'Medium';
        assigneeInput.value = task?.assignee ?? '';
        modalTitle.textContent = task ? 'Edit Task' : 'New Task';
        modalSubmit.textContent = task ? 'Save Changes' : 'Create Task';

        taskModal.hidden = false;
        titleInput.focus();
      }

      function setupTaskModal() {
        document.querySelector('#new-task-button').addEventListener('click', (event) => {
          openTaskModal(null, event.currentTarget);
        });
        document.querySelector('#modal-close').addEventListener('click', closeTaskModal);
        document.querySelector('#modal-cancel').addEventListener('click', closeTaskModal);

        taskModal.addEventListener('click', (event) => {
          if (event.target === taskModal) closeTaskModal();
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && !taskModal.hidden) closeTaskModal();
        });

        taskForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          clearModalErrors();

          const title = titleInput.value.trim();
          if (!title) {
            showModalError('Title is required', 'title');
            titleInput.focus();
            return;
          }

          const taskId = taskIdInput.value;
          const isEdit = Boolean(taskId);
          const payload = {
            title,
            description: descriptionInput.value.trim(),
            status: statusInput.value,
            priority: priorityInput.value,
            assignee: assigneeInput.value.trim() || null,
          };

          if (isEdit) {
            const existingTask = tasks.find((task) => String(task.id) === taskId);
            if (existingTask?.status === payload.status) delete payload.status;
          }

          modalSubmit.disabled = true;

          try {
            const response = await fetch(
              isEdit ? `${apiBase}/tasks/${encodeURIComponent(taskId)}` : `${apiBase}/tasks`,
              {
                method: isEdit ? 'PATCH' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              },
            );

            const succeeded = (isEdit && response.status === 200)
              || (!isEdit && response.status === 201);
            if (succeeded) {
              closeTaskModal();
              await fetchTasks();
              return;
            }

            const responsePayload = await response.json().catch(() => null);
            if (response.status === 422) {
              showServerErrors(responsePayload, response.status);
            } else {
              showModalError(getUpdateErrorMessage(responsePayload, response.status));
            }
          } catch (err) {
            showModalError('Network error saving task. Please try again.');
          } finally {
            modalSubmit.disabled = false;
          }
        });
      }

      function revertTaskStatus(taskId, previousStatus) {
        const task = tasks.find((item) => String(item.id) === String(taskId));
        if (task) task.status = previousStatus;
        renderBoard(tasks);
      }

      function createTaskCard(task) {
        const card = document.createElement('article');
        card.className = 'task-card';
        card.dataset.taskId = String(task.id ?? '');
        card.dataset.priority = String(task.priority ?? '');

        const header = document.createElement('div');
        header.className = 'task-card-header';

        const title = document.createElement('h3');
        title.textContent = task.title ?? 'Untitled task';

        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = 'edit-button';
        editButton.textContent = 'Edit';
        editButton.addEventListener('click', (event) => {
          event.stopPropagation();
          openTaskModal(task, event.currentTarget);
        });

        header.append(title, editButton);

        const description = document.createElement('p');
        description.className = 'task-description';
        description.textContent = task.description ?? '';

        const meta = document.createElement('div');
        meta.className = 'task-meta';

        const priorityBadge = document.createElement('span');
        const priorityClass = String(task.priority ?? '').toLowerCase();
        priorityBadge.className = `task-badge priority-${priorityClass}`;
        priorityBadge.textContent = task.priority ?? 'No priority';

        const assignee = document.createElement('span');
        assignee.className = 'task-badge';
        assignee.textContent = task.assignee ?? 'Unassigned';

        meta.append(priorityBadge, assignee);

        card.append(header, description, meta);
        attachDragHandlers(card);
        return card;
      }

      function sortTasks(list) {
        return [...list].sort((a, b) => {
          const aRank = priorityOrder[a.priority] ?? 99;
          const bRank = priorityOrder[b.priority] ?? 99;

          if (aRank !== bRank) return aRank - bRank;

          const ai = typeof a.id === 'number' ? a.id : parseInt(a.id, 10);
          const bi = typeof b.id === 'number' ? b.id : parseInt(b.id, 10);

          if (!Number.isNaN(ai) && !Number.isNaN(bi)) return ai - bi;

          return String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
        });
      }

      function renderBoard(taskList) {
        const grouped = { ToDo: [], InProgress: [], Done: [] };

        taskList.forEach((t) => {
          if (Object.prototype.hasOwnProperty.call(grouped, t.status)) {
            grouped[t.status].push(t);
          }
        });

        document.querySelectorAll('.kanban-column').forEach((column) => {
          const status = column.dataset.status;
          const content = column.querySelector('.column-content');
          const countEl = column.querySelector('.count');

          content.innerHTML = '';

          const tasksForStatus = sortTasks(grouped[status] ?? []);

          if (tasksForStatus.length === 0) {
            const empty = document.createElement('p');
            empty.className = 'task-description';
            empty.textContent = 'No tasks yet';
            content.appendChild(empty);
            if (countEl) countEl.textContent = '0';
            return;
          }

          tasksForStatus.forEach((task) => content.appendChild(createTaskCard(task)));
          if (countEl) countEl.textContent = String(tasksForStatus.length);
        });
      }

      function setBoardState(state) {
        const board = document.querySelector('.board');
        const status = document.querySelector('#board-status');

        board.dataset.state = state;
        board.setAttribute('aria-busy', String(state === 'loading'));
        status.replaceChildren();
        status.hidden = state === 'ready' || state === 'empty';

        if (state === 'loading') {
          status.textContent = 'Loading tasks…';
          renderBoard([]);
        }

        if (state === 'error') {
          status.append('Unable to load tasks.');
          const retryButton = document.createElement('button');
          retryButton.type = 'button';
          retryButton.className = 'edit-button';
          retryButton.textContent = 'Retry';
          retryButton.addEventListener('click', fetchTasks);
          status.appendChild(retryButton);
          renderBoard([]);
        }
      }

      function setupDropZones() {
        document.querySelectorAll('.kanban-column').forEach((column) => {
          column.addEventListener('dragover', (event) => {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
          });

          column.addEventListener('dragenter', () => column.classList.add('drop-target'));
          column.addEventListener('dragleave', () => column.classList.remove('drop-target'));

          column.addEventListener('drop', async (event) => {
            event.preventDefault();
            column.classList.remove('drop-target');

            const taskId = event.dataTransfer.getData('text/plain');
            if (!taskId) return;

            const targetStatus = column.dataset.status;
            const task = tasks.find((t) => String(t.id) === String(taskId));
            if (!task) return;

            if (task.status === targetStatus) return;

            const previousStatus = task.status;
            task.status = targetStatus;
            renderBoard(tasks);

            try {
              const resp = await fetch(`${apiBase}/tasks/${encodeURIComponent(taskId)}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: targetStatus }),
              });

              if (resp.status !== 200) {
                const payload = await resp.json().catch(() => null);
                revertTaskStatus(taskId, previousStatus);
                alert(getUpdateErrorMessage(payload, resp.status));
              }
            } catch (err) {
              revertTaskStatus(taskId, previousStatus);
              alert('Network error updating task.');
            }
          });
        });
      }

      async function fetchTasks() {
        setBoardState('loading');

        try {
          const res = await fetch(`${apiBase}/tasks`);
          if (!res.ok) throw new Error(`Failed to load tasks (${res.status})`);

          const data = await res.json();
          if (!Array.isArray(data)) throw new Error('Invalid tasks payload');

          tasks = data;
          renderBoard(tasks);
          setBoardState(tasks.length === 0 ? 'empty' : 'ready');
        } catch (err) {
          console.error(err);
          tasks = [];
          setBoardState('error');
        }
      }

      setupDropZones();
      setupTaskModal();
      setBoardState('loading');

      window.addEventListener('DOMContentLoaded', fetchTasks);
  </script>
</body>
</html>
